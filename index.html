<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Guff: real-time team chat with channels, direct messages, mentions, reactions and files." />
    <meta name="theme-color" content="#0f2a26" />
    <title>Guff</title>
    <script>
      // Apply the saved (or system) theme before first paint, so there's no flash.
      try {
        var t = localStorage.getItem("guff-theme") || "system"
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
